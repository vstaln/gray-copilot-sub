[package]
name = "gray-copilot-sub"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "GitHub Copilot provider sidecar for gray: drives the official Copilot CLI over ACP"
license = "MIT"

[lib]
name = "copilot_sub"
path = "src/lib.rs"

[[bin]]
name = "copilot-sub"
path = "src/main.rs"

[dependencies]
gray-acp-bridge = { path = "../gray-acp-bridge" }
serde_json = { version = "1", features = ["preserve_order"] }
